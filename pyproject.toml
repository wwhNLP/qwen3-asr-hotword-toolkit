[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-asr-context-deploy"
version = "0.1.0"
description = "Qwen3-ASR CTC and phoneme RAG inference with a vLLM worker backend"
requires-python = ">=3.10"

[project.optional-dependencies]
rag-native = ["numba>=0.61", "pypinyin>=0.55", "rapidfuzz>=3"]
vllm = [
    "vllm[audio]==0.22.1",
    "transformers==4.57.6",
    "xgrammar==0.2.5",
    "quack-kernels==0.3.3",
    "pypinyin>=0.55",
    "rapidfuzz>=3",
    "numba>=0.61",
    "soundfile>=0.12",
    "scipy>=1.10",
]

vllm023 = [
    "vllm[audio]==0.23.0",
    "transformers==4.57.6",
    "nvidia-cudnn-frontend==1.19.1",
    "xgrammar==0.2.5",
    "quack-kernels==0.3.3",
    "pypinyin>=0.55",
    "rapidfuzz>=3",
    "numba>=0.61",
    "soundfile>=0.12",
    "scipy>=1.10",
]

[project.entry-points."vllm.general_plugins"]
qwen3_asr_context = "qwen3_asr_vllm:register"

[project.scripts]
qwen3-asr-context = "qwen3_asr_vllm.cli:main"

[tool.setuptools.packages.find]
include = ["qwen3_asr_model*", "qwen3_asr_vllm*", "hotword*", "utils*", "training*"]

[tool.setuptools.package-data]
utils = ["*.json", "*.txt"]
hotword = ["*.txt"]
